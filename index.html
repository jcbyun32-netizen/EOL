<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="color-scheme" content="light only">
<title>기능검사</title>
<style>
*{box-sizing:border-box}
:root{color-scheme:light;--mw:28rem;--ink:#3b4854;--brand:#00ab6b;--bg:#eef1f3;--card:#fff;--line:#cbd5e1;--mute:#64748b;--soft:#f1f5f9;--danger:#dc2626}
html,body{margin:0;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;touch-action:manipulation;min-height:100vh;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;user-select:none;-webkit-user-select:none}
header{background:var(--card);border-bottom:4px solid var(--brand);position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
.wrap{max-width:var(--mw);margin:0 auto;padding:0 1rem}
.hd{display:flex;align-items:center;justify-content:space-between;padding:.75rem 1.4rem}
.hd img{height:2.25rem;width:auto;background:#fff;border-radius:4px}
.sm{font-size:.875rem;font-weight:600;padding:.5rem .75rem;border-radius:.5rem;background:var(--soft);color:var(--mute)}
main{max-width:var(--mw);margin:0 auto;padding:1rem 1rem 1.5rem}
.card{background:var(--card);border-radius:1rem;padding:1.25rem;box-shadow:0 1px 2px rgba(0,0,0,.06);margin-bottom:.75rem}
h1{font-size:1.25rem;font-weight:800;margin:0 0 .25rem}
.sub{font-size:.875rem;color:var(--mute);margin:0 0 1.25rem}
.lb{font-size:.875rem;font-weight:700;margin:0 0 .5rem;display:block}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:.75rem;margin-bottom:1.25rem}
.pf{height:4rem;border-radius:.75rem;font-size:1.5rem;font-weight:800;border:2px solid var(--line);color:var(--mute);background:var(--card)}
.pf.on{background:var(--brand);color:#fff;border-color:transparent}
.in{width:100%;height:3.5rem;padding:0 .75rem;font-size:1.2rem;border-radius:.75rem;border:2px solid var(--line);background:var(--card);color:var(--ink);outline:none}
.in:focus,.ta:focus{border-color:var(--brand)}
.row{display:flex;align-items:center;gap:.5rem;margin-bottom:1.25rem}
.pre{font-size:1.5rem;font-weight:800}
.big{width:100%;height:4rem;border-radius:.75rem;background:var(--brand);color:#fff;font-size:1.2rem;font-weight:800}
.big.dark{background:#334155}
.big:disabled,.mid:disabled{opacity:.4}
.mid{width:100%;height:3rem;border-radius:.75rem;font-weight:700;background:var(--card);border:2px solid var(--line)}
.err{color:var(--danger);font-size:.875rem;font-weight:600;margin:.75rem 0 0}
.serial{font-size:1.5rem;font-weight:800}
.meta{font-size:.875rem;color:var(--mute)}
.count{display:flex;align-items:center;justify-content:space-between}
.bar{height:.5rem;background:var(--soft);border-radius:9999px;overflow:hidden;margin-top:.6rem}
.bar i{display:block;height:100%;background:var(--brand)}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;margin-bottom:.75rem}
.cam{height:4.5rem;border-radius:.75rem;font-weight:800;font-size:1.05rem;color:#fff;background:var(--brand);box-shadow:0 4px 0 rgba(0,0,0,.2)}
.cam:active{transform:translateY(4px);box-shadow:none}
.cam.alt{background:#334155}
.cam:disabled{opacity:.35;box-shadow:none}
.ph{padding:.75rem}
.ph .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:.5rem}
.ph .no{font-weight:800}
.ph .del{font-size:.8rem;font-weight:700;color:var(--danger);padding:.35rem .6rem;border-radius:.5rem;background:var(--soft)}
.ph img{width:100%;border-radius:.6rem;display:block;max-height:22rem;object-fit:contain;background:#0001}
.ta{width:100%;margin-top:.6rem;min-height:4.5rem;padding:.6rem .75rem;font:inherit;font-size:1rem;border-radius:.75rem;border:2px solid var(--line);background:var(--card);color:var(--ink);outline:none;resize:vertical}
.empty{text-align:center;color:var(--mute);padding:2rem 1rem;border:2px dashed var(--line);border-radius:1rem;margin-bottom:.75rem}
.btns{scroll-margin-top:calc(env(safe-area-inset-top,0px) + 4.75rem)}
.next{margin-top:.6rem;height:2.75rem;border-color:var(--brand);color:var(--brand)}
@media (min-width:700px){:root{--mw:40rem}}
.fit{position:fixed;top:0;left:0;right:0;min-height:0;height:100vh;height:var(--app-h,100vh);display:flex;flex-direction:column;overflow:hidden}
.fit header .hd{padding:.4rem 1.4rem}.fit header .hd img{height:2rem}
.fit main{flex:1;min-height:0;overflow-y:auto;width:100%;display:flex;flex-direction:column;padding-top:.5rem;padding-bottom:.5rem}
.pg{flex:none;width:100%;display:grid;grid-template-columns:minmax(0,1fr);grid-template-areas:"stat" "ttl" "vp" "acts" "ta" "foot";grid-template-rows:auto auto auto auto auto auto;align-content:start;gap:.5rem}
.pg>.stat{grid-area:stat}.pg>.ttl{grid-area:ttl}.pg>.acts{grid-area:acts}.pg>.ta{grid-area:ta}
.foot{grid-area:foot;position:sticky;bottom:0;display:grid;gap:.5rem;background:var(--bg);padding-top:.25rem}
@media (min-aspect-ratio:5/4){
  :root{--mw:64rem}
  .pg{grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-areas:"vp stat" "vp ttl" "vp acts" "vp ta" "vp foot";grid-template-rows:auto auto auto auto 1fr;column-gap:.75rem}
  .foot{align-self:end}
  .pg .ta{height:3rem}
}
.stat{display:flex;align-items:center;justify-content:space-between;padding:.55rem .85rem;margin:0}
.sn{font-size:1.1rem;font-weight:800}.pn{font-size:1.1rem;font-weight:800;color:var(--brand)}
.ttl{font-weight:800;font-size:1rem}
.vp{grid-area:vp;height:18rem;position:relative;background:var(--soft);border-radius:.75rem;display:flex;align-items:center;justify-content:center;overflow:hidden}
.vp img{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:contain;display:block}
.emp{text-align:center;color:var(--mute);padding:1rem;width:100%;height:100%;display:flex;flex-direction:column}
.emp>div:first-child{flex:1;display:flex;align-items:center;justify-content:center;line-height:1.5;margin:0}
.cbtns{display:grid;gap:.6rem}
.acts,.nav{display:grid;gap:.5rem}
.acts{grid-template-columns:1.3fr 1fr .8fr}.nav{grid-template-columns:1fr 1fr}
.acts .mid,.nav .mid{height:2.75rem;font-size:.9rem}
.dl{color:var(--danger)}
.pg .ta{margin-top:0;min-height:0;height:3.5rem;resize:none}
.fin{height:3.25rem;font-size:1.1rem}
.fit .nav{margin:0}
.sticky{position:sticky;bottom:calc(env(safe-area-inset-bottom,0px) + .5rem);display:grid;gap:.5rem;padding-top:.25rem}
.thumbs{display:grid;grid-template-columns:repeat(2,1fr);gap:.6rem}
.th img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:.5rem;display:block}
.th p{margin:.25rem 0 0;font-size:.8rem;color:var(--mute);white-space:pre-wrap;word-break:break-all}
.ok{color:var(--brand);font-weight:800}
.ov{position:fixed;top:0;left:0;right:0;bottom:0;z-index:50;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:1.5rem}
.dlg{background:var(--card);border-radius:1rem;padding:1.25rem;width:100%;max-width:24rem;box-shadow:0 20px 25px -5px rgba(0,0,0,.2)}
.dlg p{white-space:pre-line;font-weight:600;margin:0 0 1rem}
.dlg div{display:flex;gap:.5rem}
.dlg button{flex:1;height:3rem;border-radius:.75rem;font-weight:700;background:var(--soft)}
.dlg button.p{background:var(--brand);color:#fff}
.sth .sub{margin-bottom:1.25rem}
@media (min-aspect-ratio:5/4){
  .stf{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);column-gap:1.75rem;align-items:center;padding:1.75rem}
  .stf .sth{padding-right:1.75rem;border-right:2px solid var(--soft)}
  .stf .sth .sub{margin-bottom:0}
  .rv{display:grid;grid-template-columns:minmax(0,20rem) minmax(0,1fr);grid-template-areas:"sum thb" "rb thb";grid-template-rows:auto 1fr;column-gap:.75rem;align-items:start}
  .rv>.sum{grid-area:sum}.rv>.thb{grid-area:thb}.rv>.rb{grid-area:rb}
  .thumbs{grid-template-columns:repeat(3,minmax(0,1fr))}
}

.tp{width:100%;height:5rem;border-radius:1rem;background:var(--card);border:2px solid var(--line);font-size:1.25rem;font-weight:800;margin-bottom:.6rem;color:var(--ink)}
.tp:active{background:var(--brand);color:#fff;border-color:transparent}
.srow{display:flex;gap:.6rem;align-items:center}
.sb{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:.4rem}
.ph img.mini,.mini.none{width:6rem;height:4.5rem;max-height:none;flex:none;border-radius:.5rem;object-fit:cover}
.mini.none{display:flex;align-items:center;justify-content:center;background:var(--soft);color:var(--mute);font-size:.75rem}
.ph .ta{min-height:3rem;height:3rem;resize:none}
.ph .mid{height:2.75rem;font-size:.9rem}
.ph .in{height:2.75rem;font-size:1rem}
.sticky{background:var(--bg);z-index:5;padding-bottom:.25rem}
select.in{appearance:auto}
</style>
</head>

<script>
const KEY='ls_funcinsp_v1',NAME_KEY='ls_oqc_inspector_v1',N=10;
const TYPES={
 SKID:{item:'SKID',name:'SKID 기능검사',opts:[['MRK00737AA KEA','737 · L타입'],['MRK00738AA KEA','738 · R타입']]},
 MLINK:{item:'M-LINK',name:'M-LINK 기능검사',opts:[['MRK00735AA LEG','735']]},
 ENC:{item:'ENCLOSURE',name:'ENCLOSURE 기능검사',opts:[['MEC00905AA AEA','905'],['MEC00907AA AEA','907']]}
};
const blank=()=>Array.from({length:N},()=>({data:'',w:0,h:0,comment:'',ftype:''}));
let S={screen:'start',type:'',pfx:'',rest:'',inspector:'',start:'',lineout:false,endTxt:'',slots:blank()};
let cur=0,warned=false;
function safeGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function safeSet(k,v){try{localStorage.setItem(k,v);return true}catch(e){return false}}
function load(){
  try{const j=safeGet(KEY);if(j){const o=JSON.parse(j);if(o&&Array.isArray(o.slots)&&o.slots.length===N)S=Object.assign(S,o)}}catch(e){}
  const n=safeGet(NAME_KEY);if(n&&!S.inspector)S.inspector=n;
  if(S.type&&!TYPES[S.type]){S.type='';S.screen='start'}
}
function save(){if(!safeSet(KEY,JSON.stringify(S))&&!warned){warned=true;tell('브라우저 저장 공간이 부족해 임시저장이 되지 않습니다.\n이 페이지를 닫지 말고 계속 진행해 주세요.')}}
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const p2=n=>String(n).padStart(2,'0');
const fmt=d=>d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())+' '+p2(d.getHours())+':'+p2(d.getMinutes())+':'+p2(d.getSeconds());
const nowLocal=()=>fmt(new Date()).slice(0,16).replace(' ','T');
const serial=()=>S.pfx+S.rest.trim();
const cleanRest=v=>{let t=String(v||'').toUpperCase().replace(/\s/g,'');const pp=S.pfx.replace(/\s/g,'');if(pp&&t.startsWith(pp))t=t.slice(pp.length);return t.replace(/\D/g,'')};
const typeName=()=>TYPES[S.type].name+(S.type==='SKID'?(S.pfx.indexOf('737')>0?' (L타입)':' (R타입)'):'');
const entries=()=>S.slots.map((s,i)=>Object.assign({},s,{label:i+1})).filter(s=>s.data||(s.comment||'').trim()||(s.ftype||'').trim());
const resultTxt=()=>S.lineout?'라인아웃':(entries().length?'특이사항 있음':'정상완료');
function ask(msg,okText,cancelText){
  okText=okText||'확인';
  return new Promise(res=>{
    const d=document.createElement('div');d.className='ov';
    d.innerHTML='<div class="dlg"><p></p><div></div></div>';
    d.querySelector('p').textContent=msg;
    const row=d.querySelector('div div');
    const done=v=>{d.remove();res(v)};
    if(cancelText!==null){const c=document.createElement('button');c.textContent=cancelText||'취소';c.onclick=()=>done(false);row.appendChild(c)}
    const o=document.createElement('button');o.className='p';o.textContent=okText;o.onclick=()=>done(true);row.appendChild(o);
    document.body.appendChild(d);
  });
}
const tell=m=>ask(m,'확인',null);

function busy(msg){
  const d=document.createElement('div');d.className='ov';
  d.innerHTML='<div class="dlg"><p style="margin:0;text-align:center"></p></div>';
  d.querySelector('p').textContent=msg;document.body.appendChild(d);
  return ()=>d.remove();
}
function fileToPhoto(file){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file),img=new Image();
    img.onload=()=>{
      const M=1024,r=Math.min(1,M/Math.max(img.naturalWidth,img.naturalHeight));
      const w=Math.round(img.naturalWidth*r),h=Math.round(img.naturalHeight*r);
      const c=document.createElement('canvas');c.width=w;c.height=h;
      c.getContext('2d').drawImage(img,0,0,w,h);
      URL.revokeObjectURL(url);
      res({data:c.toDataURL('image/jpeg',0.72),w,h,comment:''});
    };
    img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('load'))};
    img.src=url;
  });
}
function crc32(buf){
  if(!crc32.t){crc32.t=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;crc32.t[n]=c>>>0}}
  let crc=0xFFFFFFFF;
  for(let i=0;i<buf.length;i++)crc=crc32.t[(crc^buf[i])&255]^(crc>>>8);
  return (crc^0xFFFFFFFF)>>>0;
}
function makeZip(files){
  const enc=new TextEncoder(),chunks=[],central=[];
  const u16=n=>[n&255,(n>>8)&255],u32=n=>[n&255,(n>>>8)&255,(n>>>16)&255,(n>>>24)&255];
  let offset=0;
  for(const f of files){
    const name=enc.encode(f.name),data=f.bin||enc.encode(f.text),crc=crc32(data),size=data.length;
    const lh=new Uint8Array([0x50,0x4b,3,4,...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0x21),...u32(crc),...u32(size),...u32(size),...u16(name.length),...u16(0)]);
    chunks.push(lh,name,data);central.push({name,crc,size,offset});offset+=lh.length+name.length+size;
  }
  const cdStart=offset;
  for(const c of central){
    const h=new Uint8Array([0x50,0x4b,1,2,...u16(20),...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0x21),...u32(c.crc),...u32(c.size),...u32(c.size),...u16(c.name.length),...u16(0),...u16(0),...u16(0),...u16(0),...u32(0),...u32(c.offset)]);
    chunks.push(h,c.name);offset+=h.length+c.name.length;
  }
  chunks.push(new Uint8Array([0x50,0x4b,5,6,0,0,0,0,...u16(central.length),...u16(central.length),...u32(offset-cdStart),...u32(cdStart),...u16(0)]));
  return new Blob(chunks,{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
}
const xe=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,'');
function b64ToBytes(d){const b=atob(d.split(',')[1]),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}

function render(){
  $('resetBtn').style.display=S.screen==='start'?'none':'';
  if(S.screen==='inspect')return renderInspect();
  if(S.screen==='review')return renderReview();
  renderStart();
}
/* ---------- 1. 시작 화면 ---------- */
function renderStart(){
  if(!S.type){
    $('app').innerHTML=`<section class="card"><h1>기능검사</h1><p class="sub">검사 종류를 선택하세요.</p>
    ${Object.keys(TYPES).map(k=>`<button class="tp" onclick="selType('${k}')">${TYPES[k].name}</button>`).join('')}</section>`;
    return;
  }
  const T=TYPES[S.type];
  $('app').innerHTML=`<section class="card"><h1>${T.name}</h1><p class="sub">검사자·시리얼·시작시간을 입력하고 검사를 시작하세요.</p>
    <label class="lb" for="insp">검사자 이름</label>
    <input id="insp" class="in" style="margin-bottom:1.25rem" type="text" autocomplete="name" placeholder="예: 홍길동" value="${esc(S.inspector)}" oninput="S.inspector=this.value;safeSet(NAME_KEY,this.value);save()">
    <label class="lb">시리얼 번호${T.opts.length>1?' (접두사 선택 후 뒤 숫자 입력)':' (뒤 숫자 입력)'}</label>
    ${T.opts.length>1?`<select class="in" style="margin-bottom:.6rem" onchange="S.pfx=this.value;S.rest=cleanRest(S.rest);save();render()">${T.opts.map(o=>`<option value="${o[0]}" ${o[0]===S.pfx?'selected':''}>${o[0]}  (${o[1]})</option>`).join('')}</select>`:''}
    <div class="row"><span class="pre" style="font-size:1.05rem;white-space:nowrap">${esc(S.pfx)}</span>
    <input id="rest" class="in" style="flex:1;min-width:0" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" placeholder="숫자 입력" value="${esc(S.rest)}" oninput="S.rest=cleanRest(this.value);this.value=S.rest;save()"></div>
    <label class="lb" for="st">검사 시작 시간</label>
    <div class="row"><input id="st" class="in" style="flex:1;min-width:0" type="datetime-local" value="${esc(S.start)}" onchange="S.start=this.value;save()">
    <button class="mid" style="width:5.5rem;flex:none" onclick="S.start=nowLocal();save();$('st').value=S.start">현재</button></div>
    <button class="big" onclick="startInspect()">검사 시작</button>
    <p id="err" class="err" style="display:none"></p>
    <button class="mid" style="margin-top:.75rem" onclick="S.type='';save();render()">◀ 검사 종류 다시 선택</button></section>`;
}
function selType(k){S.type=k;S.pfx=TYPES[k].opts[0][0];S.rest='';if(!S.start)S.start=nowLocal();save();render();window.scrollTo(0,0)}
function startInspect(){
  const e=$('err'),bad=(m,id)=>{e.textContent=m;e.style.display='';$(id).focus()};
  if(!S.inspector.trim())return bad('검사자 이름을 입력해 주세요.','insp');
  if(!S.rest.trim())return bad('시리얼 뒤 숫자를 입력해 주세요.','rest');
  if(!S.start)return bad('검사 시작 시간을 입력해 주세요.','st');
  S.slots=blank();S.lineout=false;S.endTxt='';S.screen='inspect';save();render();window.scrollTo(0,0);
}
/* ---------- 2. 검사 (특이사항 10칸) ---------- */
function slotHtml(s,i){
  const f=s.data||(s.comment||'').trim()||(s.ftype||'').trim();
  return `<section class="card ph"><div class="top"><span class="no">특이사항 ${i+1}</span>${f?`<button class="del" onclick="clearSlot(${i})">비우기</button>`:''}</div>
  <div class="srow">${s.data?`<img class="mini" src="${s.data}" alt="">`:'<div class="mini none">사진 없음</div>'}
  <div class="sb"><button class="mid" onclick="pick(${i},'fCam')">📷 ${s.data?'다시 촬영':'촬영'}</button><button class="mid" onclick="pick(${i},'fPick')">🖼 앨범</button></div></div>
  <input class="in" style="margin-top:.6rem" type="text" placeholder="불량유형" value="${esc(s.ftype||'')}" oninput="setF(${i},this.value)">
  <textarea class="ta" placeholder="조치 내용" oninput="setC(${i},this.value)">${esc(s.comment||'')}</textarea></section>`;
}
function renderInspect(){
  const y=window.scrollY;
  $('app').innerHTML=`<section class="card"><div class="meta">${esc(typeName())} · 검사자 ${esc(S.inspector)}</div>
  <div class="serial" style="font-size:1.2rem">${esc(serial())}</div><div class="meta">검사 시작 ${esc(S.start.replace('T',' '))}</div></section>
  <div class="meta" style="margin:0 .25rem .6rem">특이사항이 있을 때만 사진·코멘트를 입력하세요 (최대 ${N}개)</div>
  ${S.slots.map(slotHtml).join('')}
  <div class="sticky"><button id="okb" class="big" onclick="complete()"></button>
  <button class="mid" style="height:auto;padding:.5rem;border-color:var(--danger);color:var(--danger)" onclick="lineOut()">라인아웃 (검사불가)<br><span style="font-size:.8rem;font-weight:600">※ 특이사항 기입 필수</span></button></div>
  <input id="fCam" type="file" accept="image/*" capture="environment" hidden onchange="addFile(this)">
  <input id="fPick" type="file" accept="image/*" multiple hidden onchange="addFiles(this)">`;
  updBtn();window.scrollTo(0,y);
}
function updBtn(){const b=$('okb');if(b)b.textContent=entries().length?'특이사항 포함 검사완료 ('+entries().length+'건)':'정상완료'}
function setF(i,v){S.slots[i].ftype=v;save();updBtn()}
function setC(i,v){S.slots[i].comment=v;save();updBtn()}
function pick(i,id){cur=i;$(id).click()}
async function clearSlot(i){if(!(await ask('특이사항 '+(i+1)+' 의 사진과 코멘트를 비울까요?','비우기')))return;S.slots[i]=blank()[0];save();renderInspect()}
async function addFile(inp){
  const f=inp.files&&inp.files[0];inp.value='';if(!f)return;
  try{const ph=await fileToPhoto(f);ph.comment=S.slots[cur].comment||'';ph.ftype=S.slots[cur].ftype||'';S.slots[cur]=ph}catch(e){await tell('사진을 불러오지 못했습니다.');return}
  save();renderInspect();
}
async function addFiles(inp){
  const files=Array.from(inp.files||[]);inp.value='';if(!files.length)return;
  const idx=[cur];for(let i=cur+1;i<N;i++)if(!S.slots[i].data)idx.push(i);
  const use=files.slice(0,idx.length),done=busy('사진 처리 중... ('+use.length+'장)');let failed=0;
  for(let k=0;k<use.length;k++){try{const ph=await fileToPhoto(use[k]);ph.comment=S.slots[idx[k]].comment||'';ph.ftype=S.slots[idx[k]].ftype||'';S.slots[idx[k]]=ph}catch(e){failed++}}
  done();save();renderInspect();
  const m=[];if(files.length>use.length)m.push('빈 칸이 부족해 '+(files.length-use.length)+'장은 제외되었습니다.');if(failed)m.push(failed+'장은 불러오지 못했습니다.');
  if(m.length)await tell(m.join('\n'));
}
function complete(){S.lineout=false;S.screen='review';save();render();window.scrollTo(0,0)}
async function lineOut(){
  if(!entries().length){await tell('라인아웃은 특이사항을 기입해야 합니다.\n불량유형·조치 내용 또는 사진을 입력해 주세요.');return}
  if(!(await ask('라인아웃(검사불가) 처리하고\n엑셀 저장 화면으로 이동할까요?','라인아웃')))return;
  S.lineout=true;S.screen='review';save();render();window.scrollTo(0,0);
}
/* ---------- 3. 확인 및 엑셀 저장 ---------- */
function renderReview(){
  const E=entries(),lo=S.lineout;
  $('app').innerHTML=`<div class="rv"><section class="card sum">
    <div class="meta">${esc(typeName())}</div><div class="serial">${esc(serial())}</div>
    <div class="meta" style="margin-top:.4rem">검사자 ${esc(S.inspector)}</div>
    <div class="meta">시작 ${esc(S.start.replace('T',' '))}${S.endTxt?' · 종료 '+esc(S.endTxt):''}</div>
    <div class="${lo?'err':'ok'}" style="margin-top:.5rem">${resultTxt()}${E.length?' · 특이사항 '+E.length+'건':''}</div></section>
    ${E.length?`<section class="card thb"><div class="thumbs">${E.map(p=>`<div class="th">${p.data?`<img src="${p.data}" alt="">`:''}<p><b>#${p.label}</b> ${esc(p.ftype||'')}<br>${esc(p.comment||'')}</p></div>`).join('')}</div></section>`:''}
    <div class="rb" style="display:grid;gap:.5rem"><button class="big" onclick="downloadXlsx()">엑셀(.xlsx) 저장${S.endTxt?' (다시 저장)':''}</button>
    <div class="meta" style="text-align:center">종료 시간은 저장하는 시각으로 자동 기록됩니다</div>
    <button class="mid" onclick="S.lineout=false;S.screen='inspect';save();render();window.scrollTo(0,0)">검사 화면으로 돌아가기</button>
    ${S.endTxt?`<button class="mid" onclick="resetAll(true)">새 검사 시작</button>`:''}</div></div>`;
}
async function resetAll(skip){
  if(skip!==true&&!(await ask('현재 검사 데이터를 지우고 처음 화면으로 돌아갈까요?\n저장하지 않은 사진과 코멘트는 사라집니다.','처음으로')))return;
  S={screen:'start',type:'',pfx:'',rest:'',inspector:S.inspector,start:'',lineout:false,endTxt:'',slots:blank()};
  save();render();window.scrollTo(0,0);
}
/* ---------- 엑셀 시트: 'EOL 불량 조치' 양식(NO/항목/S/N/불량유형/조치 내용/사진)과 동일 ---------- */
const ROWPT=90,ROWPX=120,COLB_PX=176,BOX_W=164,BOX_H=108,FIRST=4;
const cell=(ref,s,t)=>`<c r="${ref}" s="${s}" t="inlineStr"><is><t xml:space="preserve">${xe(t)}</t></is></c>`;
function dataRows(){const E=entries();if(!E.length&&S.lineout)return[{ftype:'라인아웃 (검사불가)',comment:'',data:''}];return E}
function stylesXml(){
  const bd='<border><left style="thin"><color rgb="FF000000"/></left><right style="thin"><color rgb="FF000000"/></right><top style="thin"><color rgb="FF000000"/></top><bottom style="thin"><color rgb="FF000000"/></bottom><diagonal/></border>';
  const xf=(f,fi,b,al)=>`<xf numFmtId="0" fontId="${f}" fillId="${fi}" borderId="${b}" xfId="0" applyFont="1" applyFill="1" applyBorder="1" applyAlignment="1"><alignment ${al}/></xf>`;
  const fo=(b,sz)=>`<font>${b?'<b/>':''}<sz val="${sz}"/><name val="맑은 고딕"/></font>`;
  const fl=c=>`<fill><patternFill patternType="solid"><fgColor rgb="${c}"/><bgColor indexed="64"/></patternFill></fill>`;
  return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">'+
  '<fonts count="3">'+fo(0,10)+fo(1,10)+fo(1,18)+'</fonts>'+
  '<fills count="5"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill>'+fl('FF92D050')+fl('FFD9D9D9')+fl('FFEEF1F3')+'</fills>'+
  '<borders count="2"><border><left/><right/><top/><bottom/><diagonal/></border>'+bd+'</borders>'+
  '<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>'+
  '<cellXfs count="7"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/>'+
  xf(1,3,1,'horizontal="center" vertical="center"')+xf(2,2,0,'horizontal="center" vertical="center"')+
  xf(0,0,1,'horizontal="center" vertical="center" wrapText="1"')+xf(0,0,1,'horizontal="left" vertical="center" wrapText="1"')+
  xf(1,4,1,'horizontal="left" vertical="center"')+xf(0,0,1,'horizontal="left" vertical="center" wrapText="1"')+
  '</cellXfs></styleSheet>';
}
function sheetXml(){
  const D=dataRows(),hasP=D.some(p=>p.data),R={},ht={1:40.5,3:19.5},add=(r,x)=>{R[r]=(R[r]||'')+x};
  add(1,cell('A1',2,'SLE 칠북 공장 - EOL 기능검사 조치 현황')+['B','C','D','E','F'].map(x=>`<c r="${x}1" s="2"/>`).join(''));
  ['NO','항목','S/N','불량유형','조치 내용','사진'].forEach((t,i)=>add(3,cell('ABCDEF'[i]+3,1,t)));
  D.forEach((p,i)=>{const r=FIRST+i;ht[r]=p.data?ROWPT:60;
    add(r,`<c r="A${r}" s="3"><v>${i+1}</v></c>`+cell('B'+r,3,ITEM())+cell('C'+r,3,serial())+cell('D'+r,3,p.ftype||'')+cell('E'+r,4,p.comment||'')+(p.data?`<c r="F${r}" s="3"/>`:cell('F'+r,3,'N/A')))});
  [['검사 종류',typeName()],['시리얼 넘버',serial()],['검사자',S.inspector.trim()],['검사 시작',S.start.replace('T',' ')],['검사 종료',S.endTxt],['검사 결과',resultTxt()]].forEach((x,i)=>{add(3+i,cell('H'+(3+i),5,x[0])+cell('I'+(3+i),6,x[1]))});
  const rows=Object.keys(R).map(Number).sort((a,b)=>a-b).map(r=>`<row r="${r}"${ht[r]?` ht="${ht[r]}" customHeight="1"`:' ht="22" customHeight="1"'}>${R[r]}</row>`).join('');
  return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><cols><col min="1" max="1" width="6" customWidth="1"/><col min="2" max="2" width="12" customWidth="1"/><col min="3" max="3" width="32" customWidth="1"/><col min="4" max="4" width="26.4" customWidth="1"/><col min="5" max="5" width="46" customWidth="1"/><col min="6" max="6" width="24.4" customWidth="1"/><col min="7" max="7" width="4" customWidth="1"/><col min="8" max="8" width="14" customWidth="1"/><col min="9" max="9" width="34" customWidth="1"/></cols><sheetData>'+rows+'</sheetData><mergeCells count="1"><mergeCell ref="A1:F1"/></mergeCells><pageMargins left="0.5" right="0.5" top="0.6" bottom="0.6" header="0.3" footer="0.3"/>'+(hasP?'<drawing r:id="rId1"/>':'')+'</worksheet>';
}
function drawingXml(){
  const E=9525;let a='',j=0;
  dataRows().forEach((p,i)=>{
    if(!p.data)return;j++;
    const k=Math.min(BOX_W/p.w,BOX_H/p.h),w=Math.round(p.w*k),h=Math.round(p.h*k),ox=Math.round((COLB_PX-w)/2)*E,oy=Math.max(0,Math.round((ROWPX-h)/2))*E,r=FIRST-1+i,cx=w*E,cy=h*E;
    a+=`<xdr:twoCellAnchor editAs="twoCell"><xdr:from><xdr:col>5</xdr:col><xdr:colOff>${ox}</xdr:colOff><xdr:row>${r}</xdr:row><xdr:rowOff>${oy}</xdr:rowOff></xdr:from><xdr:to><xdr:col>5</xdr:col><xdr:colOff>${ox+cx}</xdr:colOff><xdr:row>${r}</xdr:row><xdr:rowOff>${oy+cy}</xdr:rowOff></xdr:to><xdr:pic><xdr:nvPicPr><xdr:cNvPr id="${j+1}" name="특이사항 ${i+1}"/><xdr:cNvPicPr><a:picLocks noChangeAspect="1"/></xdr:cNvPicPr></xdr:nvPicPr><xdr:blipFill><a:blip r:embed="rId${j}"/><a:stretch><a:fillRect/></a:stretch></xdr:blipFill><xdr:spPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="${cx}" cy="${cy}"/></a:xfrm><a:prstGeom prst="rect"><a:avLst/></a:prstGeom></xdr:spPr></xdr:pic><xdr:clientData/></xdr:twoCellAnchor>`;
  });
  return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<xdr:wsDr xmlns:xdr="http://schemas.openxmlformats.org/drawingml/2006/spreadsheetDrawing" xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">'+a+'</xdr:wsDr>';
}
const ITEM=()=>TYPES[S.type].item;
function buildXlsxBlob(){
  const H='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n',R='http://schemas.openxmlformats.org/officeDocument/2006/relationships',PK='http://schemas.openxmlformats.org/package/2006/relationships';
  const photos=dataRows().filter(p=>p.data),hasP=photos.length>0;
  const files=[
    {name:'[Content_Types].xml',text:H+'<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Default Extension="jpeg" ContentType="image/jpeg"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>'+(hasP?'<Override PartName="/xl/drawings/drawing1.xml" ContentType="application/vnd.openxmlformats-officedocument.drawing+xml"/>':'')+'</Types>'},
    {name:'_rels/.rels',text:H+`<Relationships xmlns="${PK}"><Relationship Id="rId1" Type="${R}/officeDocument" Target="xl/workbook.xml"/></Relationships>`},
    {name:'xl/workbook.xml',text:H+`<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="${R}"><sheets><sheet name="EOL 불량 조치" sheetId="1" r:id="rId1"/></sheets></workbook>`},
    {name:'xl/_rels/workbook.xml.rels',text:H+`<Relationships xmlns="${PK}"><Relationship Id="rId1" Type="${R}/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="${R}/styles" Target="styles.xml"/></Relationships>`},
    {name:'xl/styles.xml',text:stylesXml()},
    {name:'xl/worksheets/sheet1.xml',text:sheetXml()}
  ];
  if(hasP){
    files.push({name:'xl/worksheets/_rels/sheet1.xml.rels',text:H+`<Relationships xmlns="${PK}"><Relationship Id="rId1" Type="${R}/drawing" Target="../drawings/drawing1.xml"/></Relationships>`});
    files.push({name:'xl/drawings/drawing1.xml',text:drawingXml()});
    files.push({name:'xl/drawings/_rels/drawing1.xml.rels',text:H+`<Relationships xmlns="${PK}">`+photos.map((p,i)=>`<Relationship Id="rId${i+1}" Type="${R}/image" Target="../media/image${i+1}.jpeg"/>`).join('')+'</Relationships>'});
    photos.forEach((p,i)=>files.push({name:`xl/media/image${i+1}.jpeg`,bin:b64ToBytes(p.data)}));
  }
  return makeZip(files);
}
const fileBase=()=>serial().replace(/[\\/:*?"<>|]/g,'_')+(S.lineout?'_라인아웃':'');
function downloadXlsx(){
  S.endTxt=fmt(new Date());save();
  const a=document.createElement('a');
  a.href=URL.createObjectURL(buildXlsxBlob());a.download=fileBase()+'.xlsx';
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  renderReview();
}
load();render();
</script>
